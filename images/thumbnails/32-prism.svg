<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="#0a0a0a"/>
  
  <!-- 3D Coverflow effect - three cards at angles -->
  <!-- Left card (receding) -->
  <g opacity="0.4" transform="translate(40, 80) perspective(1000px) rotateY(35deg)">
    <polygon points="0,0 40,10 40,70 0,60" fill="#667eea" opacity="0.5"/>
    <rect x="0" y="0" width="40" height="60" fill="#667eea" opacity="0.6"/>
  </g>
  
  <!-- Center card (prominent) -->
  <g filter="url(#shadow)">
    <polygon points="80,20 140,20 145,110 75,110" fill="url(#grad1)"/>
    <rect x="80" y="20" width="60" height="90" fill="url(#grad1)" rx="3"/>
    <!-- Shine effect -->
    <ellipse cx="105" cy="35" rx="15" ry="8" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Right card (receding) -->
  <g opacity="0.4" transform="translate(200, 80) perspective(1000px) rotateY(-35deg)">
    <polygon points="0,0 40,10 40,70 0,60" fill="#764ba2" opacity="0.5"/>
    <rect x="0" y="0" width="40" height="60" fill="#764ba2" opacity="0.6"/>
  </g>
  
  <!-- Reflection effect underneath -->
  <ellipse cx="150" cy="135" rx="80" ry="25" fill="#667eea" opacity="0.15"/>
  <ellipse cx="150" cy="140" rx="75" ry="20" fill="#764ba2" opacity="0.08"/>
  
  <!-- Title text -->
  <text x="150" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Prism</text>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#667eea">3D Gallery Showcase</text>
</svg>